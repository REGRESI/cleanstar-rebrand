# Live-Website auf GitHub Pages: https://www.cleanstar-dienstleistungen.de
# Bei jedem Push auf den Branch wird die Live-Version gebaut (npm run build: Basis /, indexierbar, ohne Sperre)
# und direkt als Pages-Artefakt veröffentlicht. gh-pages bleibt als Dateiensicherung erhalten. public/CNAME hält die eigene Domain bei jedem Deploy fest.
# GitHub-Einstellung: Settings → Pages → Source „GitHub Actions“.
name: Website auf GitHub Pages

on:
  push:
    branches: [claude/optimistic-hypatia-a2lf28]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cleanstar-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Live-Version bauen
        run: npm run build

      - name: Deploy-Test (alte Seite offen, neue Version, Klick) in Chromium und WebKit
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          node scripts/test-deploy.mjs
      - name: WebKit-Rauchtest (Safari-Engine, iPhone 13) - Scrollen bis zum Ende, Pins, keine Skriptfehler
        timeout-minutes: 20
        run: |
          python3 -m http.server 4177 --directory dist > /dev/null 2>&1 &
          sleep 2
          ENGINE=webkit B=http://localhost:4177 node scripts/test-performance.mjs

      - name: Prüfen, dass Domain-Datei dabei ist und nichts gesperrt ist
        run: |
          test "$(cat dist/CNAME)" = "www.cleanstar-dienstleistungen.de"
          if grep -l 'content="noindex' dist/index.html dist/leistungen/index.html; then echo "::error::noindex gefunden"; exit 1; fi
          if grep -q 'cs-gate' dist/index.html; then echo "::error::Passwort-Sperre gefunden"; exit 1; fi

      # Noch offene Seiten der vorigen Version laden beim nächsten Klick Code- und Datendateien mit altem Hash-Namen.
      # Deshalb bleiben diese Dateien aus dem bisherigen gh-pages-Stand erhalten und werden erst nach 30 Tagen
      # aufgeräumt (Liste mit dem Datum, seit dem eine Datei nicht mehr zur aktuellen Version gehört: .alte-dateien.tsv).
      - name: Dateien der vorigen Versionen behalten (30 Tage)
        run: |
          if git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" old 2>/dev/null; then
            now=$(date +%s)
            touch old/.alte-dateien.tsv
            : > dist/.alte-dateien.tsv
            kept=0
            while IFS= read -r f; do
              [ -e "dist/$f" ] && continue
              since=$(awk -F'\t' -v f="$f" '$1==f{print $2; exit}' old/.alte-dateien.tsv)
              since=${since:-$now}
              if [ $((now - since)) -lt 2592000 ]; then
                mkdir -p "dist/$(dirname "$f")"
                cp "old/$f" "dist/$f"
                printf '%s\t%s\n' "$f" "$since" >> dist/.alte-dateien.tsv
                kept=$((kept + 1))
              fi
            done < <(cd old && { find assets static-loader-data -type f 2>/dev/null; ls static-loader-data-manifest-*.json 2>/dev/null; })
            echo "Dateien früherer Versionen behalten: $kept" >> "$GITHUB_STEP_SUMMARY"
            rm -rf old
          fi

      - name: Veröffentlichungsstand kennzeichnen
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node -e "require('fs').writeFileSync('dist/build-version.json', JSON.stringify({commit:process.env.RELEASE_SHA}))"

      - name: In gh-pages veröffentlichen
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website von ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Website: https://www.cleanstar-dienstleistungen.de" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Auf GitHub Pages veröffentlichen
        id: publication
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}


  check:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tatsächlich ausgelieferte Version prüfen
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            actual=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://www.cleanstar-dienstleistungen.de/build-version.json?release=$EXPECTED_SHA&attempt=$attempt" | jq -r '.commit' 2>/dev/null || true)
            if [ "$actual" = "$EXPECTED_SHA" ]; then
              echo "Live bestätigt: $actual" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo '::error::Die Domain liefert nicht die erwartete Version aus.'
          exit 1

      - name: DNS und Erreichbarkeit
        id: reach
        run: |
          echo "DNS www:   $(dig +short www.cleanstar-dienstleistungen.de | tr '\n' ' ')"
          echo "DNS apex:  $(dig +short cleanstar-dienstleistungen.de | tr '\n' ' ')"
          out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" https://regresi.github.io/cleanstar-rebrand/ || true)
          echo "Alte Adresse regresi.github.io/cleanstar-rebrand/: HTTP $out"
          for i in $(seq 1 40); do
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" https://www.cleanstar-dienstleistungen.de/ || true)
            echo "Versuch $i: https://www.cleanstar-dienstleistungen.de/ → HTTP $out"
            if [ "${out%% *}" = "200" ]; then sleep 45; echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 15
          done
          echo "::warning::Die Domain ist per HTTPS noch nicht erreichbar. DNS-Einträge und Zertifikat prüfen (siehe README)."
          echo "ok=0" >> "$GITHUB_OUTPUT"

      - name: Website im Browser prüfen (Desktop und Handy)
        if: steps.reach.outputs.ok == '1'
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/check-site.cjs

      - name: Live-Website in WebKit (Safari-Engine, iPhone 13) - alle sechs Hauptseiten bis zum Ende scrollen
        timeout-minutes: 20
        if: steps.reach.outputs.ok == '1'
        run: |
          npx playwright install --with-deps webkit
          ENGINE=webkit B=https://www.cleanstar-dienstleistungen.de node scripts/test-performance.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-screenshots
          path: site-check/
          if-no-files-found: ignore
