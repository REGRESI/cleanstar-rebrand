# Online-Vorschau auf GitHub Pages: https://regresi.github.io/cleanstar-rebrand/
# Bei jedem Push auf den Vorschau-Branch wird die Website mit Basis /cleanstar-rebrand/, Passwort-Sperre
# und noindex gebaut (PAGES=1) und in den Branch gh-pages veröffentlicht.
# Einmalig nötig: Settings → Pages → Source „Deploy from a branch“, Branch „gh-pages“, Ordner „/ (root)“.
name: Vorschau auf GitHub Pages

on:
  push:
    branches: [claude/optimistic-hypatia-a2lf28]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Vorschau bauen (Basis /cleanstar-rebrand/, Passwort, noindex)
        run: npm run build:pages

      - name: In gh-pages veröffentlichen
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Vorschau von ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Vorschau: https://regresi.github.io/cleanstar-rebrand/" >> "$GITHUB_STEP_SUMMARY"
