# Diagnose seltener WebKit-Abstürze (Safari-Engine): baut die Seite und öffnet die betroffenen Seiten mehrfach in
# WebKit (iPhone 13), ohne zu veröffentlichen. Startet bei Änderungen an dieser Datei oder am Testskript.
name: WebKit-Diagnose
on:
  push:
    branches: [claude/optimistic-hypatia-a2lf28]
    paths: ['.github/workflows/webkit-diagnose.yml', 'scripts/test-performance.mjs']
  workflow_dispatch:
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Playwright und WebKit installieren
        timeout-minutes: 10
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Über uns und Startseite je 8-mal in WebKit
        timeout-minutes: 30
        run: |
          python3 -m http.server 4177 --directory dist > /dev/null 2>&1 &
          sleep 2
          for p in /ueber-uns/ /; do ONLY=$p REPEAT=8 ENGINE=webkit B=http://localhost:4177 node scripts/test-performance.mjs || true; done
