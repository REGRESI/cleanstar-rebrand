<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      ;(function () {
        var d = document.documentElement
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("js-motion")
        // Sicherheitsnetz: falls JavaScript gar nicht startet, Inhalte nach 10 s trotzdem zeigen
        setTimeout(function () { if (!window.__csReady) d.classList.remove("js-motion") }, 10000)
      })()
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
